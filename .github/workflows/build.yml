name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Only run on the single unified repo (post-consolidation).
jobs:
  build:
    if: github.repository == 'CTO-DRS/wakil'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # android-actions/setup-android@v3 currently fails on `sdkmanager tools` (removed package).
      # The ubuntu-latest image ships the SDK preinstalled with licenses accepted,
      # so we only ensure the exact components AGP needs for this project.
      - name: Ensure Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -path '*/bin/*' 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKM" ]; then
            echo "sdkmanager not found - relying on AGP auto-install of missing components"
            exit 0
          fi
          echo "sdkmanager: $SDKM"
          "$SDKM" --list_installed | head -30
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Build PTY helper (libwakil_pty.so)
        run: scripts/build-pty.sh

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Unit test report on failure
        if: failure()
        run: |
          find app/build/test-results -name "*.xml" | head -5 | xargs -I{} sh -c 'echo "=== {} ==="; grep -oE "<failure[^>]*message=\"[^\"]*\"|testsuite name=\"[^\"]*\" tests=\"[^\"]*\" failures=\"[^\"]*\"" {} | head -20' || true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --warning-mode summary

      - name: Show APK info
        run: |
          ls -lh app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wakil-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release signing: keystore + credentials arrive as GitHub Secrets
      # (WAKIL_KEYSTORE_BASE64 / WAKIL_KEYSTORE_PASSWORD / WAKIL_KEY_ALIAS / WAKIL_KEY_PASSWORD).
      # Without secrets the gradle config falls back to the fixed debug key.
      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KS_B64: ${{ secrets.WAKIL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            KS="$RUNNER_TEMP/wakil-release.keystore"
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            {
              echo "WAKIL_KEYSTORE_FILE=$KS"
              echo "WAKIL_KEYSTORE_PASSWORD=${{ secrets.WAKIL_KEYSTORE_PASSWORD }}"
              echo "WAKIL_KEY_ALIAS=${{ secrets.WAKIL_KEY_ALIAS }}"
              echo "WAKIL_KEY_PASSWORD=${{ secrets.WAKIL_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "Release signing: keystore decoded from secrets."
          else
            echo "Release signing secrets missing - falling back to debug key."
          fi

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --stacktrace --warning-mode summary

      - name: Verify release signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Stage release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Wakil-${GITHUB_REF_NAME}-arm64.apk"
          sha256sum dist/*.apk

      - name: Attach signed APK to release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
