name: Build APK (Android)
on:
  push:
  workflow_dispatch:
concurrency:
  group: wakil-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Signing key (same key every build, so updates install in place)
        run: |
          mkdir -p ~/.android
          if [ -f .wakil/debug.keystore.b64 ]; then base64 -d .wakil/debug.keystore.b64 > ~/.android/debug.keystore; fi
      - name: Build
        run: |
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
          else gradle assembleDebug --no-daemon --stacktrace; fi
      - uses: actions/upload-artifact@v4
        with:
          name: @@NPM_NAME@@-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
