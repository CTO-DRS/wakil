name: Build APK (Flutter)
on:
  push:
  workflow_dispatch:
concurrency:
  group: wakil-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android platform files (created on first build if missing)
        run: |
          if [ ! -d android ]; then
            NAME=$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}')
            flutter create --platforms=android --org @@ORG@@ --project-name "$NAME" .
          fi
      - name: Signing key (same key every build, so updates install in place)
        run: |
          mkdir -p ~/.android
          if [ -f .wakil/debug.keystore.b64 ]; then base64 -d .wakil/debug.keystore.b64 > ~/.android/debug.keystore; fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: @@NPM_NAME@@-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
